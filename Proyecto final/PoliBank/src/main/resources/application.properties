spring.application.name=PoliBank

# Datasource - SQLite (archivo en la raíz del proyecto)
spring.datasource.url=jdbc:sqlite:./PoliBank.db
spring.datasource.driver-class-name=org.sqlite.JDBC

# JPA / Hibernate
spring.jpa.database-platform=org.hibernate.community.dialect.SQLiteDialect
# SQLite no tiene BIGINT (solo INTEGER), por eso 'validate' falla con campos Long.
# 'none' cumple el mismo objetivo: no crear ni modificar el esquema.
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true

# Scheduling habilitado (para OfertaPrestamoJob)
spring.task.scheduling.enabled=true
